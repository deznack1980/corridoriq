<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CorridorIQ — Supplier Command Center</title>
  <link rel="icon" href="assets/brand/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="assets/vendor/leaflet-1.9.4/leaflet.css" />
  <link rel="stylesheet" href="portal.css" />
</head>
<body>
  <template id="pageContent">
    <section class="hero-band">
      <div class="hero-top">
        <div>
          <div class="eyebrow" id="heroDate">Phoenix metro</div>
          <h2 id="heroTitle">Supplier command center</h2>
          <div class="hero-sub">Qualified accounts, live permit activity, and verified contacts across the organization — checked every morning.</div>
        </div>
        <div class="stack" style="align-items:flex-end;gap:12px">
          <div id="refreshCard"></div>
          <div class="hero-actions">
            <a class="btn btn-sm" href="opportunities.html?context=organization">Review opportunities</a>
            <a class="btn btn-sm" href="assignments.html">Assign work</a>
            <button class="btn btn-sm btn-primary" id="runRefreshBtn" type="button">Run morning refresh</button>
          </div>
        </div>
      </div>
      <div id="execStrip"></div>
    </section>

    <div class="section-title">Today's accounts <span class="sub">Accounts that passed today's checks — the list is never padded</span></div>
    <div id="todaysAccounts"></div>

    <div class="section-title">Opportunity map</div>
    <div id="mapWorkspace" class="card card-pad map-workspace"></div>

    <div class="split">
      <div>
        <div class="section-title" style="margin-top:4px">Recent opportunity activity</div>
        <div id="opps"></div>
      </div>
      <div>
        <div class="section-title" style="margin-top:4px">Procurement</div>
        <div id="rfqEntry"></div>
        <div class="section-title">Quick actions</div>
        <div id="actions" class="stack" style="flex-direction:row;flex-wrap:wrap;gap:8px;margin-bottom:18px"></div>
      </div>
    </div>

    <div class="section-title">Operations <span class="sub">Source freshness and refresh history</span></div>
    <div class="split-even">
      <div><div class="eyebrow" style="margin-bottom:8px">Jurisdiction freshness</div><div id="freshness"></div></div>
      <div><div class="eyebrow" style="margin-bottom:8px">Recent pipeline activity</div><div id="pipeline"></div></div>
    </div>
  </template>
  <script src="assets/vendor/leaflet-1.9.4/leaflet.js"></script>
  <script src="portal-common.js"></script>
  <script src="map-workspace.js"></script>
  <script src="admin-dashboard.js"></script>
</body>
</html>
