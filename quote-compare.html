<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CorridorIQ — Quote Comparison</title>
  <link rel="icon" href="assets/brand/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="portal.css" />
  <style>
    .offer-card { border:1px solid var(--border); border-radius:var(--radius); padding:16px 18px; margin-bottom:12px; background:var(--surface); box-shadow:var(--shadow-sm); }
    .offer-card.recommended { border-color:var(--gold); box-shadow:0 0 0 2px var(--gold-soft) inset; }
    .offer-card.unavailable { opacity:.6; }
    .offer-head { display:flex; justify-content:space-between; align-items:baseline; gap:12px; }
    .offer-rank { font-size:22px; font-weight:800; color:var(--gold-strong); }
    .offer-total { font-size:22px; font-weight:800; }
    .offer-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px 20px; margin-top:12px; }
    .offer-grid div span { display:block; font-size:12px; color:var(--text-3); }
    .flag { display:inline-block; padding:2px 8px; margin:2px 4px 0 0; border-radius:999px; font-size:11px; background:var(--red-bg); color:var(--red); }
    .rec-banner { padding:12px 16px; border-radius:var(--radius-sm); background:var(--gold-soft); border:1px solid var(--gold); margin-bottom:16px; font-weight:600; }
    .avail-yes { color:var(--green); font-weight:600; } .avail-no { color:var(--red); font-weight:600; }
  </style>
</head>
<body>
  <template id="pageContent">
    <h2 id="prodTitle" style="margin-bottom:4px">Quote comparison</h2>
    <p class="muted" style="margin-top:0">Suppliers ranked by lowest estimated <strong>total fulfillment cost</strong> (materials + delivery + handling) — not unit price alone.</p>
    <div class="filters" style="align-items:flex-end">
      <label class="fld">Quantity<input type="number" id="quantity" value="1" min="1" step="1" style="width:110px" /></label>
      <label class="fld">Jobsite city<input type="text" id="city" value="Phoenix" /></label>
      <label class="fld">State<input type="text" id="state" value="AZ" style="width:70px" /></label>
      <button class="btn btn-primary btn-sm" id="compareBtn">Compare suppliers</button>
    </div>
    <div id="recBanner"></div>
    <div id="offers"></div>
  </template>
  <script src="portal-common.js"></script>
  <script src="quote-compare.js"></script>
</body>
</html>
