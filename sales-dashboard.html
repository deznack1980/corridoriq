<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CorridorIQ — Dashboard</title>
  <link rel="icon" href="assets/brand/corridoriq-mark-amber.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="assets/vendor/leaflet-1.9.4/leaflet.css" />
  <link rel="stylesheet" href="portal.css" />
</head>
<body>
  <template id="pageContent">
    <section class="hero-band">
      <div class="hero-top">
        <div>
          <div class="eyebrow" id="heroDate">Phoenix metro</div>
          <h2 id="heroTitle">Today's accounts</h2>
          <div class="hero-sub">Who to call, why now, and how to reach them — from published permit records on your book.</div>
        </div>
        <div id="refreshCard"></div>
      </div>
      <div id="execStrip"></div>
    </section>

    <div class="section-title">Today's accounts <span class="sub">Accounts that passed today's checks — the list is never padded</span></div>
    <div id="todaysAccounts"></div>

    <div class="section-title">Opportunity map</div>
    <div id="mapWorkspace" class="card card-pad map-workspace"></div>

    <div class="split">
      <div>
        <div class="section-title" style="margin-top:4px">Needs attention today</div>
        <div id="followups"></div>
      </div>
      <div>
        <div class="section-title" style="margin-top:4px">Your activity <span class="sub">Last 30 days</span></div>
        <div id="summary" class="kpi-grid"></div>
        <div id="rfqEntry" style="margin-top:14px"></div>
      </div>
    </div>

    <div class="section-title">Priority companies <span class="spacer"></span><a href="my-companies.html">All companies</a></div>
    <div id="priority"></div>
  </template>
  <script src="assets/vendor/leaflet-1.9.4/leaflet.js"></script>
  <script src="portal-common.js"></script>
  <script src="map-workspace.js"></script>
  <script src="sales-dashboard.js"></script>
</body>
</html>
