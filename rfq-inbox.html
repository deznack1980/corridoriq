<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CorridorIQ — RFQ Inbox (Sample)</title>
  <link rel="icon" href="assets/brand/corridoriq-mark-amber.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="portal.css" />
  <style>
    .inbox { display: grid; grid-template-columns: 330px minmax(0, 1fr); gap: 18px; align-items: start; }
    .inbox-list { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow-sm); }
    .inbox-item { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--border); background: none; padding: 14px 16px; cursor: pointer; font-family: inherit; color: inherit; }
    .inbox-item:last-child { border-bottom: 0; }
    .inbox-item:hover { background: var(--surface-2); }
    .inbox-item.on { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
    .inbox-item .ii-top { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
    .inbox-item .ii-from { font-weight: 650; font-size: 13.5px; }
    .inbox-item .ii-title { font-size: 12.5px; color: var(--text-2); margin-top: 3px; line-height: 1.4; }
    .inbox-item .ii-meta { font-size: 11.5px; color: var(--text-3); margin-top: 5px; }
    .qt td input, .qt td select { min-height: 32px; padding: 5px 8px; font-size: 13px; }
    .qt td, .qt th { padding-left: 8px; padding-right: 8px; }
    .qt td.px input { width: 92px; text-align: right; }
    .qt td.ld input { width: 58px; text-align: right; }
    .qt td.av select { width: 126px; }
    .done-box { text-align: center; padding: 34px 20px; }
    .done-box .ok { width: 52px; height: 52px; border-radius: 50%; background: var(--signal-soft); color: var(--signal-strong); display: grid; place-items: center; font-size: 24px; margin: 0 auto 12px; }
    @media (max-width: 1100px) { .inbox { grid-template-columns: minmax(0, 1fr); } }
  </style>
</head>
<body>
  <template id="pageContent">
    <div class="page-head">
      <div>
        <div class="eyebrow" id="ibAs">RFQ inbox</div>
        <h2>RFQ inbox</h2>
        <div class="sub">Requests for quote from contractors who chose your branch. You see only your own quote — never another supplier's pricing.</div>
      </div>
      <div class="row"><span class="badge outline">Sample supplier view</span></div>
    </div>
    <div class="inbox">
      <div>
        <div class="inbox-list" id="ibList"></div>
      </div>
      <div id="ibDetail"></div>
    </div>
  </template>
  <script src="demo/rfq-sample-data.js"></script>
  <script src="portal-common.js"></script>
  <script src="demo/procurement-preview.js"></script>
  <script src="rfq-inbox.js"></script>
</body>
</html>
